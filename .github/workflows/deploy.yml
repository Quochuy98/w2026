name: Deploy to Oracle Cloud

on:
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên giao diện GitHub
  push:
    branches:
      - deploy   # Tự động chạy khi push/merge vào nhánh deploy
      - master   # Tự động chạy khi push/merge vào nhánh master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          ENV_CONTENT: ${{ secrets.ENV_LOCAL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: TARGET_BRANCH,ENV_CONTENT
          script_stop: true
          script: |
            echo "=========================================================="
            echo ">>> Bắt đầu tiến trình triển khai tự động lên Oracle Cloud"
            echo "=========================================================="

            # 1. Cấu hình Swap RAM (2GB) để tránh lỗi tràn RAM khi build Next.js
            echo ">>> [1/7] Kiểm tra Swap RAM..."
            if [ ! -f /swapfile ]; then
              echo "Tạo 2GB swapfile..."
              sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "Đã kích hoạt 2GB Swap."
            else
              echo "Swap đã tồn tại."
            fi

            # 2. Cấu hình Firewall Ubuntu (iptables) cho cổng 80 & 443
            echo ">>> [2/7] Cấu hình tường lửa iptables cho Port 80 & 443..."
            sudo iptables -C INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT 1 -p tcp --dport 80 -j ACCEPT
            sudo iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || sudo iptables -I INPUT 1 -p tcp --dport 443 -j ACCEPT
            if command -v netfilter-persistent >/dev/null 2>&1; then
              sudo netfilter-persistent save || true
            fi

            # 3. Tự động cài đặt Node.js 22 LTS & PM2 nếu chưa có
            echo ">>> [3/7] Kiểm tra Node.js & PM2..."
            if ! command -v node >/dev/null 2>&1; then
              echo "Cài đặt Node.js 22 LTS..."
              sudo apt-get update -y
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs git
            fi
            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Cài đặt PM2..."
              sudo npm install -g pm2
              pm2 startup systemd -u ubuntu --hp /home/ubuntu || true
            fi

            # 4. Tự động cài đặt & cấu hình Caddy Reverse Proxy (Port 80 -> 3000)
            echo ">>> [4/7] Kiểm tra Caddy Reverse Proxy..."
            if ! command -v caddy >/dev/null 2>&1; then
              echo "Cài đặt Caddy Server..."
              sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg --yes
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
              sudo apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
              
              echo "Tạo cấu hình Caddy reverse proxy port 80 -> 3000..."
              printf ":80 {\n    reverse_proxy 127.0.0.1:3000\n}\n" | sudo tee /etc/caddy/Caddyfile
              sudo systemctl restart caddy
            fi

            # 5. Tải mã nguồn mới nhất về server
            echo ">>> [5/7] Cập nhật mã nguồn dự án..."
            sudo mkdir -p /var/www/w2026
            sudo chown -R ubuntu:ubuntu /var/www/w2026

            if [ ! -d /var/www/w2026/.git ]; then
              echo "Clone kho mã nguồn lần đầu..."
              git clone https://github.com/Quochuy98/w2026.git /var/www/w2026
            fi

            cd /var/www/w2026
            git fetch --all
            # Ưu tiên nhánh trigger (deploy/master), fallback về master
            BRANCH="${TARGET_BRANCH:-master}"
            git checkout "$BRANCH" 2>/dev/null || git checkout master
            git reset --hard "origin/$BRANCH" 2>/dev/null || git reset --hard origin/master

            # Cập nhật file biến môi trường .env.local nếu có cấu hình secret
            if [ -n "$ENV_CONTENT" ]; then
              echo "Đang ghi cấu hình .env.local..."
              printf "%s\n" "$ENV_CONTENT" > .env.local
            fi

            # 6. Cài đặt dependencies và build Next.js
            echo ">>> [6/7] Cài đặt dependencies & Build Next.js..."
            npm install
            npm run build

            # 7. Khởi động / Khởi động lại ứng dụng với PM2
            echo ">>> [7/7] Khởi động ứng dụng bằng PM2..."
            pm2 describe w2026 >/dev/null 2>&1 && pm2 restart w2026 --update-env || pm2 start npm --name "w2026" --cwd /var/www/w2026 -- start
            pm2 save

            echo "=========================================================="
            echo ">>> TRIỂN KHAI THÀNH CÔNG!"
            echo ">>> Bạn có thể truy cập website tại IP Public của máy chủ."
            echo "=========================================================="
