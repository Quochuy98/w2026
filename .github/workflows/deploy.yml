name: Deploy to Oracle Cloud

on:
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên giao diện GitHub
  push:
    branches:
      - deploy   # Tự động chạy khi push/merge vào nhánh deploy
      - master   # Tự động chạy khi push/merge vào nhánh master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /var/www/w2026
            sudo mkdir -p /var/www/w2026-data/album
            sudo chown -R ubuntu:ubuntu /var/www/w2026-data 2>/dev/null || true
            if [ -d public/images/album ] && [ ! -L public/images/album ]; then
              cp -r -n public/images/album/* /var/www/w2026-data/album/ 2>/dev/null || true
            fi
            git fetch --all
            git checkout master
            git reset --hard origin/master
            mkdir -p public/images
            ln -sfn /var/www/w2026-data/album public/images/album
            if [ -n "${{ secrets.ENV_LOCAL }}" ]; then
              printf "%s\n" "${{ secrets.ENV_LOCAL }}" > .env.local
            fi
            bash scripts/deploy-server.sh

